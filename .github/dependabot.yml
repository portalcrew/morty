version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      # The Worker and the generated migrations stay on the stable 0.x line. The CLI pins its own 1.0 release candidate
      # for the node:sqlite driver. An update moves every occurrence of a dependency to one version, which would put the
      # CLI on the stable line, so both lines move by hand, orm and kit together.
      - dependency-name: "drizzle-orm"
      - dependency-name: "drizzle-kit"
    # Groups follow risk, so a breaking change in one area never holds back the others. A dependency joins the first
    # group whose patterns match it.
    groups:
      # Agent and protocol SDKs change behavior the Computer adapts to.
      agent-sdks:
        patterns:
          - "@anthropic-ai/*"
          - "@agentclientprotocol/*"
        update-types:
          - minor
          - patch
      cloudflare:
        patterns:
          - "wrangler"
          - "miniflare"
          - "@cloudflare/*"
        update-types:
          - minor
          - patch
      # The browser and acceptance jobs run in the Playwright image of the suite's exact version, which Dependabot does
      # not update: its pull request also moves the image in morty-pipeline.yml before it merges.
      playwright:
        patterns:
          - "@playwright/*"
          - "playwright"
          - "playwright-core"
        update-types:
          - minor
          - patch
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
