name: CodeQL

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  schedule:
    - cron: '31 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config: |
            threat-models: [remote, local]
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        id: analysis
        with:
          category: /language:${{ matrix.language }}
          wait-for-processing: true
      - name: Reject unresolved high and critical alerts
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CODEQL_SARIF_ID: ${{ steps.analysis.outputs.sarif-id }}
          CODEQL_CATEGORY: /language:${{ matrix.language }}
        with:
          script: |
            const category = process.env.CODEQL_CATEGORY;
            const sarifId = process.env.CODEQL_SARIF_ID;
            if (!sarifId) {
              return core.setFailed('CodeQL did not return an upload ID');
            }
            const options = { ...context.repo, per_page: 100, request: { timeout: 60000 } };
            // Bind the gate to this upload, not an older scan or an empty alert list after failure.
            const analyses = await github.paginate('GET /repos/{owner}/{repo}/code-scanning/analyses', {
              ...options, sarif_id: sarifId
            });
            if (analyses.length !== 1 || analyses.some(analysis =>
              analysis.commit_sha !== context.sha || analysis.ref !== context.ref ||
              analysis.category !== category || analysis.tool.name !== 'CodeQL' || analysis.error
            )) {
              return core.setFailed('Missing or mismatched CodeQL analysis for this revision');
            }
            // GitHub owns alert identity and reviewed dismissals across PRs and queue branches.
            const alerts = await github.paginate('GET /repos/{owner}/{repo}/code-scanning/alerts', {
              ...options, ref: context.ref, tool_name: 'CodeQL', state: 'open'
            });
            const blocking = [];
            for (const alert of alerts) {
              const instance = alert.most_recent_instance;
              if (instance.category !== category || instance.state !== 'open') continue;
              if (instance.commit_sha !== context.sha) {
                return core.setFailed('CodeQL alert results are stale for this revision');
              }
              if (['high', 'critical'].includes(alert.rule.security_severity_level)) {
                blocking.push(alert);
                core.error(`Blocking ${alert.rule.security_severity_level} alert: ${alert.html_url}`);
              }
            }
            if (blocking.length) {
              return core.setFailed(`${blocking.length} unresolved high/critical CodeQL alerts`);
            }
            core.info(`CodeQL high/critical gate passed for ${category} at ${context.sha}`);

  # A successful analyzer only means the scan ran. This required check also
  # requires every uploaded result to pass the severity gate, including in a queue.
  codeql-high-severity:
    needs: analyze
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every language and severity check
        env:
          ANALYZE_RESULT: ${{ needs.analyze.result }}
        run: test "$ANALYZE_RESULT" = success
