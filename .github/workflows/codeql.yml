name: CodeQL

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  schedule:
    - cron: '31 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config: |
            threat-models: [remote, local]
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        id: analysis
        with:
          category: /language:${{ matrix.language }}
          wait-for-processing: true
      - name: Reject unresolved high and critical alerts
        env:
          GH_TOKEN: ${{ github.token }}
          CODEQL_SARIF_ID: ${{ steps.analysis.outputs.sarif-id }}
          CODEQL_CATEGORY: /language:${{ matrix.language }}
        run: python3 .github/security/codeql-gate.py

  # A successful analyzer only means the scan ran. This required check also
  # requires every uploaded result to pass the severity gate, including in a queue.
  codeql-high-severity:
    needs: analyze
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every language and severity check
        env:
          ANALYZE_RESULT: ${{ needs.analyze.result }}
        run: test "$ANALYZE_RESULT" = success
