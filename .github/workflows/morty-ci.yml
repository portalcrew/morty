name: Morty CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# A newer push supersedes the checks of the previous one. Each merge group has
# its own ref, so queued groups never cancel each other.
concurrency:
  group: morty-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every job starts at once. The pipeline classifies the change itself, so that nothing waits for a job that only
  # decides whether the change is Markdown-only.
  pipeline:
    uses: ./.github/workflows/morty-pipeline.yml
    with:
      base-sha: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
      head-sha: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
      # The merge queue commit becomes main unchanged; main releases its accepted archive.
      release: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/main' }}
    permissions:
      contents: read
      actions: read

  # The single required check. It fails unless every applicable pipeline job
  # succeeded, including when the pipeline was cancelled.
  ci-ok:
    needs: [pipeline]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require the complete pipeline to pass
        env:
          PIPELINE: ${{ needs.pipeline.result }}
        run: test "$PIPELINE" = success
